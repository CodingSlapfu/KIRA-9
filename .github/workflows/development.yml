name: KIRA-9 development acceptance and backup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kira-9-development-checkpoint
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'checkpoint:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.19'
      - run: python3 -m pip install pillow
      - name: Acoustic analysis dependency (no transcription model)
        if: startsWith(github.event.head_commit.message, 'fix(acoustic):')
        run: python3 -m pip install numpy==2.3.5
      - name: Pin native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/setup_native.py > build-native-environment.json
          python3 -c "import json,os; d=json.load(open('build-native-environment.json')); open(os.environ['GITHUB_ENV'],'a').write(''.join(k+'='+v+'\n' for k,v in d.items()))"
      - name: Verify and archive development checkpoint
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" != fix\(acoustic\):* ]]; then python3 tools/test_backup.py; fi
          if [[ "$COMMIT_MESSAGE" == fix\(ci\):* ]]; then
            ./tools/resume_checkpoint.sh 2>&1 | tee verification.log
          elif [[ "$COMMIT_MESSAGE" == fix\(vocal\):* ]]; then
            ./tools/verify_checkpoint.sh --vocal 2>&1 | tee verification.log
          elif [[ "$COMMIT_MESSAGE" == fix\(acoustic\):* ]]; then
            ./tools/verify_acoustic.sh 2>&1 | tee verification.log
          else
            ./tools/verify_checkpoint.sh 2>&1 | tee verification.log
          fi
          test -s build/checkpoint/KIRA-9-development-checkpoint.zip
          (cd build/checkpoint && sha256sum -c SHA256SUMS)
      - name: Record release gate separately from development checks
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/requirement_gate.py --phase release > release-gate.txt; then
            echo 'All required release evidence supplied.'
          else
            cat release-gate.txt
            echo 'Development checkpoint only; release publication remains blocked.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KIRA-9-development-${{ github.sha }}
          path: |
            build/checkpoint/*
            verification.log
            release-gate.txt
          if-no-files-found: error
          retention-days: 90
  preserve_backup:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KIRA-9-development-${{ github.sha }}
          path: .
      - name: Verify and preserve existing acceptance artifact
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: ./tools/preserve_backup.sh
