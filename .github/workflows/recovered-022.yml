          "name": "Restore verified source 15",
          "run": "cat > /tmp/kira-recovery-014 <<'KIRA_SOURCE_EOF'\nt>7||!Number.isInteger(kind)||kind<0||kind>5||(kind>=3&&slot))throw Error('Invalid library kind or slot.');return session(input,output,async tx=>{try{let ack=await exchange(input,output,tx,0x62,[kind,slot,...le16(bytes.length),...u32(crc32(bytes))],options),offset=ack.offset;if(ack.total!==bytes.length||ack.crc!==crc32(bytes)||ack.data.length)throw Error('Device upload metadata did not match this asset.');if(offset>bytes.length)throw Error('Invalid resume offset.');while(offset<bytes.length){const end=Math.min(bytes.length,offset+96);ack=await exchange(input,output,tx,0x63,[...le16(offset),...bytes.slice(offset,end)],options);if(ack.offset!==end||ack.total!==bytes.length||ack.data.length)throw Error('Device did not acknowledge this exact chunk.');offset=end;progress(offset/bytes.length);}ack=await exchange(input,output,tx,0x64,[],options);if(ack.offset!==bytes.length||ack.total!==bytes.length||ack.crc!==crc32(bytes)||ack.data.length)throw Error('Device commit metadata did not confirm this asset. Read the slot back before retrying.');}catch(error){try{await exchange(input,output,tx,0x66,[],{timeout:150,retries:0});}catch{}throw error;}});}\\nexport async function download(input,output,slot,kind=0,progress=()=>{},options={}){if(!Number.isInteger(slot)||slot<0||slot>7||!Number.isInteger(kind)||kind<0||kind>5||(kind>=3&&slot))throw Error('Invalid library kind or slot.');return session(input,output,async tx=>{let offset=0,total=-1,crc=0,bytes;do{const r=await exchange(input,output,tx,0x65,[kind,slot,...le16(offset)],options);if(total<0){total=r.total;crc=r.crc;if(total<1||total>3840)throw Error('Invalid object length.');bytes=new Uint8Array(total);}if(r.total!==total||r.crc!==crc||r.offset!==offset||!r.data.length||r.data.length>96||offset+r.data.length>total)throw Error('Library changed or read was corrupt; retry when the device is idle.');bytes.set(r.data,offset);offset+=r.data.length;progress(offset/total);}while(offset<total);if(crc32(bytes)!==crc)throw Error('Downloaded object checksum failed.');return bytes;});}\\n\\nexport const transfer=upload;\\n\",\"sha256\":\"27c14a377d189430832612e08e655aea7549e5f2acb8b1385366cb2dbdcca812\"},\"tools/setup_native.py\":{\"content\":\"#!/usr/bin/env python3\\n\\\"\\\"\\\"Pinned, noninteractive native dependencies; never downloads into a source tree.\\\"\\\"\\\"\\nimport pathlib,urllib.request,hashlib,tarfile,os,json\\nroot=pathlib.Path(__file__).resolve().parents[1];deps=root/'build/deps';deps.mkdir(parents=True,exist_ok=True)\\nurl='https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz';sha='a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd';archive=deps/'toolchain.tar.xz'\\ndef fetch(url,path,sha):\\n if not path.exists() or hashlib.sha256(path.read_bytes()).hexdigest()!=sha:\\n  temp=path.with_suffix('.part');urllib.request.urlretrieve(url,temp)\\n  if hashlib.sha256(temp.read_bytes()).hexdigest()!=sha:raise SystemExit('Dependency hash mismatch: '+url)\\n  temp.replace(path)\\nfetch(url,archive,sha)\\ntc=deps/'jieli-linux-toolchains-20260730.1'\\nif not (tc/'pi32v2/bin/clang').exists():\\n # Python's data extraction filter rejects special files and strips archive ownership.\\n with tarfile.open(archive) as tar:tar.extractall(deps,filter='data')\\nsdk=deps/'sdk/cpu/wl82/tools';sdk.mkdir(parents=True,exist_ok=True)\\nhashes={'uboot.boot':'4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4','cfg_tool.bin':'276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b','cfg/eq_cfg_hw.bin':'41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d'}\\nfor path,digest in hashes.items():\\n target=sdk/path;target.parent.mkdir(parents=True,exist_ok=True);fetch('https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/AC79NN_SDK_V1.2.1_2023-12-13/cpu/wl82/tools/'+path,target,digest)\\nprint(json.dumps({'JIELI_TOOLCHAIN':str(tc),'AC79_SDK':str(deps/'sdk')}))\\n\",\"sha256\":\"499dede70f9844e1d3ce51670ae0477cc18a872c8c9d25f692442aaf447e2785\"},\"tools/build_web.sh\":{\"content\":\"#!/bin/sh\\nset -eu\\ncd \\\"\\u0024(dirname \\\"\\u00240\\\")/..\\\"\\n: \\\"\\u0024{EMCC:=emcc}\\\"\\n\\\"\\u0024EMCC\\\" -O2 -ffp-contract=off -Icore core/engine.c core/codec.c core/library.c core/tables.c core/face.c studio/bridge.c --no-entry -sSTANDALONE_WASM -sINITIAL_MEMORY=2097152 -sSTACK_SIZE=65536 -Wl,--export=web_face_pose -Wl,--export=web_face -Wl,--export=web_pose -Wl,--export=web_parameters -Wl,--export=web_init -Wl,--export=web_input -Wl,--export=web_load -Wl,--export=web_demo -Wl,--export=web_stop -Wl,--export=web_voice -Wl,--export=web_render -Wl,--export=web_viseme -Wl,--export=web_tick -Wl,--export=web_playing -o studio/kira.wasm\\n\",\"sha256\":\"35bf6b1a54bc3afe2f45d88d775c1baf81de1607ee9ef254c2c85c8b0ea5a9af\"},\"tools/verify_development022.py\":{\"content\":\"#!/usr/bin/env python3\\n\\\"\\\"\\\"Verify actual KIRA-9 development package; never installs on hardware/deploys.\\\"\\\"\\\"\\nimport pathlib,sys,json,hashlib,struct,subprocess,ast,fcntl,shutil\\nr=pathlib.Path(__file__).resolve().parents[1];out=r/'validation/development-022';out.mkdir(exist_ok=True);sys.path.insert(0,str(r/'platform/tools'));import fm1_install as I, fm1pkg_make as P\\nraw=(r/'app/build/kira-9-0.2.2-dev.fwsc').read_bytes();image=I.logical_image(raw);assert I.product_of(raw)=='FM-1_74000202';head=bytearray(image[:64]);P.enc(head,0,64);assert P.crc16(head[2:])==struct.unpack_from('<H',head)[0];n=struct.unpack_from('<H',head,8)[0];assert P.crc16(image[64:64+n*80])==struct.unpack_from('<H',head,2)[0];parts={}\\nfor j in range(n):\\n e=bytearray(image[64+j*80:64+(j+1)*80]);P.enc(e,0,80);typ,_,crc,_,off,size,_=struct.unpack_from('<HHHHIII',e);data=image[off:off+size];assert len(data)==size and P.crc16(data)==crc;parts[typ]=data\\nassert parts[100]==(r/'app/build/loader/ota.bin').read_bytes();region=bytearray(parts[0][0x4000:]);P.sfc(region,0,len(region),0,P.KEY);app=(r/'app/build/kira-9.bin').read_bytes();assert region[0x120:0x120+len(app)]==app;assert set(region[0x120+len(app):0x120+P.APP_SLOT])<={255}\\n# Cross-check package write span against ALL30 A/B storage pairs; no old power-cut replay.\\nimport re\\nh=(r/'app/app.h').read_text();m=h[h.index('#define APP_STORE_MAP'):h.index('#define APP_BACKUP_OBJS')];slots=[int(x,16) for x in re.findall(r'0x([0-9a-f]+)u',m)];assert len(slots)==30 and min(slots)>=len(parts[0]);assert all(a+8192<=b or b+8192<=a for i,a in enumerate(slots) for b in slots[i+1:])\\nnm=subprocess.check_output(['nm','--defined-only',str(r/'app/build/kira-9.elf')],text=True);symbols={x[2]:int(x[0],16) for line in nm.splitlines() if len(x:=line.split())==3};assert not any(name.startswith(('rp_','mg_')) for name in symbols)\\nram=symbols['_bss_end']-symbols['_data_start'];pool=symbols['_pool_end']-symbols['_pool_start'];rt=symbols['_rt_end']-symbols['_rt_start'];assert ram<=98304 and pool<=344064 and len(app)<=P.APP_SLOT\\nbudgets={'app_bytes':len(app),'app_slot_bytes':P.APP_SLOT,'app_spare':P.APP_SLOT-len(app),'data_bss_bytes':ram,'data_bss_spare':98304-ram,'pool_bytes':pool,'pool_spare':344064-pool,'ram_code_bytes':rt,'ram_code_spare':32768-rt,'conservative_future_voice_reserve_flash':73728,'conservative_future_voice_reserve_ram':8192,'flash_after_reserve':P.APP_SLOT-len(app)-73728,'data_bss_after_reserve':98304-ram-8192,'experimental_voice_linked':False,'physical_cpu':'UNVERIFIED; no host measurement claimed as FM-1 timing'}\\nassert budgets['flash_after_reserve']>0 and budgets['data_bss_after_reserve']>0\\n# Reuse simulator definitions, not its already-completed generic tests.\\np=r/'platform/tests/install_test.py';tree=ast.parse(p.read_text());nodes=[]\\nfor node in tree.body:\\n if isinstance(node,ast.Expr) and isinstance(node.value,ast.Call) and isinstance(node.value.func,ast.Name) and node.value.func.id=='wire':break\\n nodes.append(node)\\nns={'__file__':str(p),'__name__':'kira_specific_install_fixture'};exec(compile(ast.Module(body=nodes,type_ignores=[]),str(p),'exec'),ns);Fake=ns['FakeFM1'];cli=ns['cli'];results=[]\\nfor label,identity,name,unplug,target in [('direct-development-update','FM-1_74000201','FM-1',None,'FM-1_74000202'),('loader-recovery','ota-FM-1_74000202','Felucca Update',None,'FM-1_74000202'),('connection-loss','FM-1_74000202','FM-1',2,'FM-1_74000202'),('wrong-final-identity','FM-1_74000202','FM-1',None,'FM-1_999')]:\\n d=Fake(image,identity=identity,name=name,unplug_after=unplug,after_write=target);rc,stdout,stderr=cli([str(r/'app/build/kira-9-0.2.2-dev.fwsc'),'--yes','--classic'],d);expected=4 if unplug else 6 if target!='FM-1_74000202' else 0;assert rc==expected,(label,rc,stdout,stderr);assert d.bad==0;results.append({'case':label,'exit_code':rc,'expected':expected,'served_reads':d.served,'wrong_bytes':d.bad,'scope':'Host installer protocol simulation with actual package; not real flash writes/power loss.'})\\nshutil.rmtree(ns['TMP'],ignore_errors=True)\\nfiles={n:hashlib.sha256((r/n).read_bytes()).hexdigest() for n in ['app/build/kira-9.bin','app/build/kira-9.elf','app/build/kira-9-0.2.2-dev.fwsc','app/build/loader/ota.bin','studio/kira.wasm']}\\nreport={'identity':'FM-1_74000202','release_accepted':False,'published':False,'checks':'Python and JS actual-package validation; decrypted app bytes and loader exact;30store pairs outside package flash; experimental voice absent; classic direct/recovery/loss/final-ID fixtures','memory':budgets,'installer_cases':results,'artifacts_sha256':files,'limitations':'Fast real-loader interrupted flash/rollback physical acceptance remains unverified; existing generic fixtures retained, not replayed. Same development identity cannot identify source revision on a physical unit: use matching manifest/build ID; release identity/version gated.'};(out/'package-and-budgets.json').write_text(json.dumps(report,indent=2)+'\\\\n');print(json.dumps(report,indent=2))\\n\",\"sha256\":\"b282ee51d690fe15cde423b1d5e5197