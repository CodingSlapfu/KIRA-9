st uint8_t *p, uint16_t n) {\\n  (void)ctx;\\n  if (kind == 5)\\n    return k9_arrangement_read(p, n, 0);\\n  if (kind < 3)\\n    return k9_decode(&validation_song, p, n);\\n  if (kind == 4)\\n    return k9_voicebank_read(p, n, 0);\\n  return k9_document_valid(p, n, kind);\\n}\\nstatic int xsave(void *ctx, uint8_t kind, uint8_t slot, const uint8_t *p,\\n                 uint16_t n) {\\n  int rc;\\n  (void)ctx;\\n  rc = plat_store_save(library_object(kind, slot), p, n);\\n  if (!rc) {\\n    int got = plat_store_load(library_object(kind, slot), song_wire,\\n                              sizeof song_wire);\\n    if (got != (int)n || memcmp(song_wire, p, n))\\n      return -1;\\n  }\\n  if (!rc) {\\n    if (kind < 3) {\\n      memcpy(&custom, &validation_song, sizeof custom);\\n      memcpy(custom_wire, p, n);\\n      custom_length = n;\\n      load_pending = 1;\\n      k9_preset profile;\\n      if (k9_score_preset(p, n, &profile))\\n        preset_to_prefs(&profile);\\n    }\\n    if (kind == 5) {\\n      k9_arrangement a;\\n      if (k9_arrangement_read(p, n, &a)) {\\n        prefs.tempo = a.tempo;\\n        prefs.parts = a.count;\\n        prefs.loop = a.loop;\\n        prefs.chain = a.active;\\n        memcpy(prefs.order, a.slots, 8);\\n      }\\n    }\\n    if (kind == 4)\\n      presets_load();\\n    library_cache_load();\\n    app_say(\\\"TRANSFER SAVED\\\", \\\"\\\");\\n  }\\n  return rc;\\n}\\nstatic const k9_transfer_io xio = {0, xbusy, xload, xvalid, xsave};\\nstatic void transfer_send(const uint8_t *body, uint16_t n) {\\n  uint8_t raw[120];\\n  unsigned i, bits = 0, acc = 0;\\n  uint8_t sum = 0;\\n  raw[0] = 0;\\n  raw[1] = 0x59;\\n  raw[2] = 0x67;\\n  raw[3] = (uint8_t)n;\\n  raw[4] = (uint8_t)(n >> 8);\\n  raw[5] = 0;\\n  memcpy(raw + 6, body, n);\\n  for (i = 0; i < n; i++)\\n    sum = (uint8_t)(sum + body[i]);\\n  raw[6 + n] = (uint8_t)~sum;\\n  tx_position = 0;\\n  tx_length = 0;\\n  tx_reply[tx_length++] = 0xf0;\\n  for (i = 0; i < n + 7u; i++) {\\n    acc |= (unsigned)raw[i] << bits;\\n    bits += 8;\\n    while (bits >= 7) {\\n      tx_reply[tx_length++] = (uint8_t)(acc & 127);\\n      acc >>= 7;\\n      bits -= 7;\\n    }\\n  }\\n  if (bits)\\n    tx_reply[tx_length++] = (uint8_t)acc;\\n  tx_reply[tx_length++] = 0xf7;\\n}\\nstatic void transfer_poll(void) {\\n  k9_transfer_poll(&transfer_state, plat_ms());\\n  while (tx_position < tx_length && plat_midi_out_room(TO_USB)) {\\n    uint32_t p;\\n    unsigned left = tx_length - tx_position, take = left >= 3 ? 3 : left,\\n             cin = left > 3 ? 4 : 4 + take;\\n    p = cin;\\n    for (unsigned i = 0; i < take; i++)\\n      p |= (uint32_t)tx_reply[tx_position + i] << (8u + 8u * i);\\n    plat_midi_send(p, TO_USB);\\n    tx_position = (uint16_t)(tx_position + take);\\n  }\\n}\\nstatic void restart_song(void) {\\n  engine.voice = prefs.voice;\\n  engine.external = (prefs.sync == 1 || prefs.sync == 3) ? 2 : prefs.sync != 0;\\n  engine.source = (prefs.sync == 1 || prefs.sync == 3) ? 255 : TO_USB;\\n  if (prefs.chain) {\\n    const k9_song *list[8];\\n    unsigned i;\\n    for (i = 0; i < prefs.parts; i++)\\n      list[i] = &song_cache[prefs.order[i]];\\n    if (!k9_playlist(&engine, list, prefs.parts))\\n      app_say(\\\"ARRANGER HAS EMPTY PART\\\", \\\"\\\");\\n    else {\\n      for (i=0;i<prefs.parts;i++) {\\n        unsigned slot=prefs.order[i];\\n        chain_profiles[i]=song_profile_valid[slot]?song_profiles[slot]:prefs_to_preset();\\n        engine.playlist_profiles[i]=&chain_profiles[i];\\n      }\\n      k9_apply_preset(&engine,engine.playlist_profiles[0]);\\n    }\\n  } else\\n    k9_start(&engine, load_pending ? &custom : &factory_songs[prefs.song]);\\n}\\nstatic void prefs_defaults(void) {\\n  memset(&prefs, 0, sizeof prefs);\\n  prefs.magic = 0x4b395032u;\\n  prefs.twitch = 1;\\n  prefs.breath = 6;\\n  prefs.vibrato = 20;\\n  prefs.glide = 50;\\n  prefs.expression = 110;\\n  prefs.parts = 1;\\n  for (unsigned i = 0; i < 8; i++)\\n    prefs.order[i]