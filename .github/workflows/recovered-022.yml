"\\n#include \\\"kira.h\\\"\\n#include \\\"memory.h\\\"\\nstatic uint16_t x16(const uint8_t *p) { return p[0] | (uint16_t)p[1] << 8; }\\nstatic uint32_t x32(const uint8_t *p) {\\n  return x16(p) | (uint32_t)x16(p + 2) << 16;\\n}\\nstatic void w16(uint8_t *p, uint16_t n) {\\n  p[0] = (uint8_t)n;\\n  p[1] = (uint8_t)(n >> 8);\\n}\\nstatic void w32(uint8_t *p, uint32_t n) {\\n  w16(p, (uint16_t)n);\\n  w16(p + 2, (uint16_t)(n >> 16));\\n}\\nvoid k9_transfer_init(k9_transfer *t) { memset(t, 0, sizeof *t); }\\nvoid k9_transfer_poll(k9_transfer *t, uint32_t now) {\\n  if (t->active && (int32_t)(now - t->deadline) >= 0)\\n    t->active = 0;\\n}\\nuint16_t k9_transfer_command(k9_transfer *t, const k9_transfer_io *io,\\n                             uint32_t now, uint8_t op, const uint8_t *p,\\n                             uint16_t n, uint8_t *r, uint16_t cap) {\\n  uint16_t tx, nout = 0, offset = 0, total = 0;\\n  uint32_t crc = 0;\\n  uint8_t result = K9_X_BAD;\\n  if (n < 2 || cap < 13)\\n    return 0;\\n  tx = x16(p);\\n  k9_transfer_poll(t, now);\\n  if (op == 0x62 && n == 10) {\\n    uint8_t kind = p[2], slot = p[3];\\n    uint16_t len = x16(p + 4);\\n    uint32_t sum = x32(p + 6);\\n    if (kind > 5 || slot > 7 || (kind >= 3 && slot) || !len ||\\n        len > K9_XFER_MAX)\\n      result = K9_X_BOUNDS;\\n    else if (io->busy(io->ctx))\\n      result = K9_X_BUSY;\\n    else if (t->active && t->transaction != tx)\\n      result = K9_X_BUSY;\\n    else if (t->active && t->transaction == tx) {\\n      result = t->kind == kind && t->slot == slot && t->length == len &&\\n                       t->crc == sum\\n                   ? K9_X_OK\\n                   : K9_X_BAD;\\n    } else {\\n      t->transaction = tx;\\n      t->kind = kind;\\n      t->slot = slot;\\n      t->length = len;\\n      t->crc = sum;\\n      t->received = 0;\\n      t->active = 1;\\n      t->last_valid = 0;\\n      result = K9_X_OK;\\n    }\\n    if (!result) {\\n      t->deadline = now + 5000;\\n      offset = t->received;\\n      total = t->length;\\n      crc = t->crc;\\n    }\\n  } else if (op == 0x63 && n > 4 && n <= 4 + K9_XFER_CHUNK) {\\n    offset = x16(p + 2);\\n    total = t->length;\\n    if (!t->active || tx != t->transaction)\\n      result = K9_X_EXPIRED;\\n    else if (offset > t->received || offset + n - 4 > t->length)\\n      result = K9_X_ORDER;\\n    else if (offset < t->received) {\\n      result = offset + n - 4 <= t->received &&\\n                       !memcmp(t->data + offset, p + 4, n - 4)\\n                   ? K9_X_OK\\n                   : K9_X_ORDER;\\n    } else {\\n      memcpy(t->data + offset, p + 4, n - 4);\\n      t->received = (uint16_t)(offset + n - 4);\\n      result = K9_X_OK;\\n    }\\n    offset = t->received;\\n    if (!result)\\n      t->deadline = now + 5000;\\n  } else if (op == 0x64 && n == 2) {\\n    if (!t->active && t->last_valid && tx == t->last_transaction)\\n      result = t->last_result;\\n    else if (!t->active || tx != t->transaction)\\n      result = K9_X_EXPIRED;\\n    else if (t->received != t->length)\\n      result = K9_X_ORDER;\\n    else if (io->busy(io->ctx))\\n      result = K9_X_BUSY;\\n    else if (k9_crc(t->data, t->length) != t->crc ||\\n             !io->validate(io->ctx, t->kind, t->data, t->length))\\n      result = K9_X_CRC;\\n    else if (io->save(io->ctx, t->kind, t->slot, t->data, t->length))\\n      result = K9_X_SAVE;\\n    else\\n      result = K9_X_OK;\\n    if (t->active && tx == t->transaction && result != K9_X_ORDER &&\\n        result != K9_X_BUSY) {\\n      t->active = 0;\\n      t->last_transaction = tx;\\n      t->last_result = result;\\n      t->last_valid = 1;\\n    }\\n    total = t->length;\\n    offset = t->received;\\n    crc = t->crc;\\n  } else if (op == 0x65 && n == 6) {\\n    uint8_t kind = p[2], slot = p[3];\\n    int got;\\n    offset = x16(p + 4);\\n    if (kind > 5 || slot > 7 || (kind >= 3 && slot))\\n      result = K9_X_BOUNDS;\\n    else if (t->active || io->b