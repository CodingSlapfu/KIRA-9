og(`PASS all five modes native/WASM 1,024,000 PCM samples and 2,000 exact poses; max error \\u0024{worst}`);\\n\",\"sha256\":\"943c6c0cf7836ed4d73cb5c0cc63a5c01e1d5e2eb57eb0c9bb8eb9d7f5817a2c\"},\"tests/test_performance022.c\":{\"content\":\"#include \\\"kira.h\\\"\\n#include \\\"phrasing.h\\\"\\n#include <assert.h>\\n#include <math.h>\\n#include <stdio.h>\\nstatic float pcm[512];\\nstatic void render(k9_engine *e,unsigned frames){while(frames){unsigned n=frames>256?256:frames;k9_render(e,pcm,n);for(unsigned i=0;i<n*2;i++)assert(isfinite(pcm[i])&&fabsf(pcm[i])<=.94f);frames-=n;}}\\nint main(void){\\n k9_engine e;k9_init(&e);e.vocal_mode=K9_VOCALISE;k9_midi(&e,1,0x90,60,100);assert(e.freq==k9_pitch[60]);render(&e,12000);uint32_t onset=e.vibrato_start;k9_midi(&e,1,0x90,64,100);assert(e.vibrato_start==onset);assert(e.freq!=k9_pitch[64]);\\n k9_midi(&e,1,0xb0,64,127);k9_midi(&e,1,0x80,64,0);assert(e.velocity&&e.deferred_off);k9_midi(&e,2,0xb0,64,0);assert(e.velocity&&e.sustain);k9_midi(&e,1,0xb0,64,0);assert(!e.velocity&&!e.sustain&&!e.live_transition);\\n e.vocal_mode=K9_SCAT;k9_midi(&e,1,0x90,60,100);assert(e.live_transition);k9_midi(&e,1,0x80,60,0);assert(!e.live_transition);render(&e,3000);assert(!e.velocity);\\n e.vocal_mode=K9_HUM;k9_midi(&e,1,0x90,60,100);k9_midi(&e,1,0xb0,64,127);k9_midi(&e,1,0x80,60,0);render(&e,1000);k9_face f=k9_face_at(&e,500,2,0);assert(!f.open&&!f.jaw&&f.lid==3);k9_midi(&e,1,0xb0,120,0);assert(!e.velocity&&!e.sustain&&!e.deferred_off);\\n k9_init(&e);e.external=1;e.source=2;e.sample=2200;k9_clock_at(&e,2,1000);k9_clock_at(&e,2,1000);k9_clock_at(&e,2,3000);k9_clock_at(&e,1,1919);assert(e.clocks==1);k9_clock_at(&e,2,1919);assert(e.clocks==2&&e.clock_tick==8);e.sample=K9_RATE*3u;k9_clock_at(&e,2,2000);assert(e.clocks==2);\\n assert(k9_diphthong_progress(22050,44100)==0);assert(k9_diphthong_progress(44100,44100)==1);assert(k9_diphthong_progress(800,1000)>0&&k9_diphthong_progress(800,1000)<1);\\n k9_song s={.count=1,.bpm=120,.ticks=384,.events={{0,384,K9_AY,60,100,1,0}}};k9_init(&e);k9_start(&e,&s);render(&e,22050);assert(e.viseme==k9_phones[K9_AA].viseme);render(&e,65000);assert(e.viseme==k9_phones[K9_IY].viseme);\\n puts(\\\"PASS first-note tuning, legato vibrato continuity, source-owned sustain/panic, cancelled scat onset, closed hum expression, duplicate/future/stale clock rejection, late diphthong/viseme timing and bounded PCM\\\");\\n}\\n\",\"sha256\":\"008662263a2eb544246397eaafffe45c0db90ecec88433bbf409008fd7eb65ca\"},\"tests/worklet_profiles.mjs\":{\"content\":\"import fs from 'node:fs';import assert from 'node:assert/strict';import {compile,encode} from '../studio/model.mjs';import {timeline} from '../studio/performance.mjs';\\nlet Processor;globalThis.sampleRate=48000;globalThis.AudioWorkletProcessor=class{constructor(){this.port={postMessage:()=>{}};}};globalThis.registerProcessor=(_,p)=>Processor=p;\\nawait import('../studio/voice-worklet.js');\\nconst project={format:'KIRA9-PROJECT-1',bpm:120,lyrics:'[Verse]\\\\nhello\\\\n[Bridge]\\\\nmmm',sectionSettings:{1:{vocalMode:'Hum',density:1,voice:3,emotion:2,expression:75}}};const dictionary={hello:['HH','EH','L','OW']},song=compile(project,dictionary),profiles=timeline(project,dictionary),m=new WebAssembly.Module(fs.readFileSync('studio/kira.wasm'));\\nconst p=new Processor({processorOptions:{module:m}});p.port.onmessage({data:{command:'load',bytes:encode(song),profiles}});let hum=false,energy=0;\\nfor(let block=0;block<450;block++){const a=[new Float32Array(128),new Float32Array(128)];assert(p.process([], [a]));for(const v of a[0]){assert(Number.isFinite(v)&&Math.abs(v)<1);energy+=v*v;}if(p.engine.web_tick()>profiles[1].tick+8&&p.engine.web_playing()){assert.equal(p.emotion,2);assert.equal(p.engine.web_pose()>>>8,0);hum=true;}}\\nassert(hum&&energy>1);p.port.onmessage({data:{command:'stop'}});assert(!p.engine.web_playing());assert.equal(p.engine.web_pose(),0);console.log('PASS actual WASM AudioWorklet mixed profiles at 48 kHz, closed-lip hum, finite PCM, distinct emotion and STOP');\\n\",\"sha256\":\"bf03bada0c1e1ffeee6102f12844ad76891b39a0b72a3125eccfc99788827016\"},\"tests/performance_timeline.mjs\":{\"content\":\"import assert from 'node:assert/strict';\\nimport {timeline,ProfileTimeline} from '../studio/performance.mjs';\\nimport {compile,encodeEditable} from '../studio/model.mjs';\\nconst p={format:'KIRA9-PROJECT-1',lyrics:'[Verse]\\\\nhello\\\\n[Bridge]\\\\nmmm',bpm:120,voice:0,sectionSettings:{1:{vocalMode:'Hum',voice:3,emotion:2,expression:75}}};\\nconst t=timeline(p,{hello:['HH','EH','L','OW']});assert.equal(t.length,2);assert.equal(t[1].tick,102);let calls=[];const e={web_voice:(...args)=>calls.push(['voice',...args]),web_parameters:(...args)=>calls.push(['params',...args])};const run=new ProfileTimeline(e,t);assert.equal(calls.length,2);run.advance(101);assert.equal(calls.length,2);assert.equal(run.advance(102),2);assert.equal(calls[2][1],3);assert.equal(calls[3][6],75);run.advance(500);assert.equal(calls.length,4);assert.throws(()=>encodeEditable(compile(p,{hello:['HH','EH','L','OW']}),p),/arrangement/);console.log('PASS full mixed preview profile boundaries, distinct expression and safe arrangement-only device profile export');\\n\",\"sha256\":\"a71c4eb0f20d1b3a89de6b8abda88790c539a546a8d4c667256459e9a3aa399b\"},\"tests/test_section_pr\nKIRA_SOURCE_EOF\n"
