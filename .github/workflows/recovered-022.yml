ll arrangement saved. On the FM-1, PLAY performs the sections in order offline.');}catch(e){status(e.message);}};\\n\\u0024('connect').onclick=async()=>{try{if(!navigator.requestMIDIAccess)throw Error('Web MIDI needs Chrome or Edge.');midi=await navigator.requestMIDIAccess({sysex:true});for(const [id,ports]of [['midiIn',midi.inputs],['midiOut',midi.outputs]]){\\u0024(id).replaceChildren();for(const port of ports.values()){const option=document.createElement('option');option.value=port.id;option.textContent=port.name;\\u0024(id).append(option);}}status('Choose the KIRA-9 USB input and output. Other firmware cannot accept song transfers.');}catch(e){status(e.message);}};\\n\\u0024('transfer').onclick=async()=>{try{if(!midi)throw Error('Choose MIDI ports first.');const input=midi.inputs.get(\\u0024('midiIn').value),output=midi.outputs.get(\\u0024('midiOut').value);if(!input||!output)throw Error('Choose both MIDI ports.');const bytes=(()=>{const p=performance();return encodeEditable(p.song,p.source);})();if(!confirm(`Save to device \\u0024{['song','phrase','word'][Number(\\u0024('kind').value)]} slot \\u0024{Number(\\u0024('slot').value)+1}? Existing contents will be replaced.`))return;await transfer(input,output,bytes,Number(\\u0024('slot').value),p=>status(`Transferring \\u0024{Math.round(p*100)}%\\u2026`),Number(\\u0024('kind').value));status('Device confirmed the song was saved.');}catch(e){status(e.message);}};\\nfunction face(ms){\\n if(fallback&&playing){const index=Math.min(fallbackFrames.length-1,Math.max(0,fallbackFrames.findLastIndex(f=>f.time<=(ctx.currentTime-fallbackStart)))),f=fallbackFrames[index];if(f){portraitPose=f.pose||0;previewEmotion=f.emotion||0;tick=f.tick;\\u0024('progress').style.width=Math.min(100,100*tick/total)+'%';}}\\n if(portrait&&ms-portraitAt>=50){portraitAt=ms;const c=\\u0024('face').getContext('2d');portraitImage??=c.createImageData(240,240);const pose=playing?portraitPose:0,p=portrait.web_face_pose(pose,Math.floor(ms),playing?previewEmotion:(performanceProject(project,\\u0024('section').value).emotion||0),project.twitch??1),pixels=new Uint16Array(portrait.memory.buffer,p,240*240),rgba=portraitImage.data;for(let i=0;i<pixels.length;i++){const value=pixels[i],j=i*4;rgba[j]=((value>>11)&31)*255/31;rgba[j+1]=((value>>5)&63)*255/63;rgba[j+2]=(value&31)*255/31;rgba[j+3]=255;}c.putImageData(portraitImage,0,0);}\\n requestAnimationFrame(face);\\n}requestAnimationFrame(face);\\n(async()=>{try{module=await WebAssembly.compileStreaming(fetch('kira.wasm'));portrait=new WebAssembly.Instance(module,{}).exports;portrait._initialize?.();portrait.web_init();}catch(e){status('Portrait engine could not load: '+e.message);}})();\\ntry{const saved=localStorage.getItem('kira9-project-v1');if(saved)project=validateProject(JSON.parse(saved));}catch{}fill();\\nsetupLibrary({status,project:()=>{read();return project;},openProject:newProject,setPronunciations:p=>{userPronunciations=p;},applyPreset:p=>{remember();for(const key of expressionKeys)if(p[key]!==undefined)setPerformance(project,\\u0024('section').value,key,p[key]);fill();status('Preset applied to the selected scope. Preview to audition.');},ports:()=>({input:midi?.inputs.get(\\u0024('midiIn').value),output:midi?.outputs.get(\\u0024('midiOut').value)})});\\ntry{[dictionary,demos]=await Promise.all([fetch('dictionary.json').then(r=>r.json()),fetch('songs.json').then(r=>r.json())]);for(const [i,d]of demos.entries()){const button=document.createElement('button');button.className='demo';const b=document.createElement('b');b.textContent=String(i+1).padStart(2,'0');const title=document.createElement('span');title.textContent=d.name;const small=document.createElement('small');small.textContent=d.style+' \\u00b7 '+d.bpm+' BPM';button.append(b,title,small);button.onclick=()=>{if(project.lyrics&&!confirm('Open this demo? Your current draft stays in Undo.'))return;newProject({...project,title:d.name,lyrics:d.lyrics,bpm:d.bpm,align:[],overrides:{}});status('Original factory demo opened.');};\\u0024('demos').append(button);}alignment();status('Ready. Edit lyrics, check pronunciation, then preview.');}catch(e){status('Pronunciation data could not load. Reload when the local files are available.');}\\nwindow.addEventListener('pagehide',()=>{read();stop();});\\n\\nfunction fillVocal(){const p=performanceProject(project,\\u0024('section').value),defaults={voice:0,style:0,emotion:0,morph:0,breath:6,vibrato:20,glide:50,harmony:0,expression:110,vocalMode:'Lyrics',syllables:'',density:8,swing:0,wordlessNotes:[60,64,67,69,67,64,62,60],noteTicks:p.vocalMode==='Scat'?48:96,seed:0};for(const key of expressionKeys)\\u0024(key).value=key==='wordlessNotes'?(p[key]??defaults[key]).join(' '):(p[key]??defaults[key]);}\\nfor(const key of expressionKeys)\\u0024(key).onchange=()=>{remember();setPerformance(project,\\u0024('section').value,key,key==='wordlessNotes'?\\u0024(key).value.trim().split(/\\\\s+/).map(Number):['vocalMode','syllables'].includes(key)?\\u0024(key).value:Number(\\u0024(key).value));persist();if(playing){const p=performanceProject(project,\\u0024('section').value);node?.port.postMessage({command:'voice',voice:p.voice??0,style:p.style??0,parameters:parameters(p)});}};\\n\\u0024('m\nKIRA_SOURCE_EOF\n"
        },
        {
          "name": "Restore verified source 14",
          "run": "cat > /tmp/kira-recovery-013 <<'KIRA_SOURCE_EOF'\nodeDefaults').onclick=()=>{remember();for(const [key,value]of Object.entries(modeDefaults(\\u0024('vocalMode').value)))setPerformance(project,\\u0024('section').value,key,value);fillVocal();persist();status('Technique defaults applied to the selected scope. Lyrics preserved.');};\\n\\u0024('section').addEventListener('change',()=>{stop();fillVocal();});fillVocal();\\n\",\"sha256\":\"787ca484804dbde3f40a9f7853bc420fb3339197c5c65b0e0f899543c3c80683\"},\"studio/index.html\":{\"content\":\"<!doctype html><html lang=\\\"en\\\"><head><meta charset=\\\"utf-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\"><title>KIRA-9 \\u00b7 Songwriting Studio</title><meta name=\\\"description\\\" content=\\\"Write an original song for your cybernetic vocalist. Edit English pronunciation, melody and timing, and preview the actual KIRA-9 singing engine.\\\"><link rel=\\\"stylesheet\\\" href=\\\"style.css\\\"></head><body>\\n<header><a class=\\\"brand\\\" href=\\\"#\\\">KIRA<span>\\u2014</span>9 <small>VOCAL SYSTEM</small></a><nav><a href=\\\"#workspace\\\">Studio</a><a href=\\\"emulator/\\\">FM-1 emulator</a><a href=\\\"#library\\\">Library</a><a href=\\\"#install\\\">Install</a></nav><span class=\\\"tag\\\">DEVELOPMENT PREVIEW</span></header>\\n<main><section class=\\\"intro\\\"><div><p class=\\\"eyebrow\\\">A VOICE BEYOND THE CIRCUIT</p><h1>Give the machine<br><em>something to sing.</em></h1><p class=\\\"lede\\\">Your words. Her voice. Shape an English vocal performance, down to the breath between notes.</p></div><aside><span class=\\\"indicator\\\"></span> Local singing engine<br><small>Original source-filter voice \\u00b7 no recorded voicebank</small></aside></section>\\n<section class=\\\"library-tools\\\"><label>Vocal mode<select id=\\\"vocalMode\\\"><option>Lyrics</option><option>Vocalise</option><option>Scat</option><option>Hum</option><option>Vocables</option></select></label><label>Syllable pattern<input id=\\\"syllables\\\" value=\\\"ooh ah na la\\\"></label><label>Notes per phrase<input id=\\\"density\\\" type=\\\"number\\\" min=\\\"1\\\" max=\\\"32\\\" value=\\\"8\\\"></label><label>Swing ticks<input id=\\\"swing\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"16\\\" value=\\\"0\\\"></label><label>Emotion (0\\u20133)<input id=\\\"emotion\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"3\\\" value=\\\"0\\\"></label><label>Breath<input id=\\\"breath\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"6\\\"></label><label>Vibrato<input id=\\\"vibrato\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"20\\\"></label><label>Glide<input id=\\\"glide\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"50\\\"></label><label>Voice morph<input id=\\\"morph\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"0\\\"></label><label>Harmony<input id=\\\"harmony\\\" type=\\\"number\\\" min=\\\"-12\\\" max=\\\"12\\\" value=\\\"0\\\"></label><label>Expression<input id=\\\"expression\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"127\\\" value=\\\"110\\\"></label><label>Melody MIDI notes<input id=\\\"wordlessNotes\\\" value=\\\"60 64 67 69 67 64 62 60\\\"></label><label>Note length (ticks)<input id=\\\"noteTicks\\\" type=\\\"number\\\" min=\\\"48\\\" max=\\\"1536\\\" value=\\\"96\\\"></label><label>Pattern variation<input id=\\\"seed\\\" type=\\\"number\\\" min=\\\"0\\\" max=\\\"65535\\\" value=\\\"0\\\"></label><button id=\\\"modeDefaults\\\">Apply technique defaults</button><p>Choose a section below to assign its mode. Lyrics remain editable. Melody notes can be edited in the score.</p></section><section id=\\\"workspace\\\" class=\\\"workspace\\\"><aside class=\\\"performer\\\"><div class=\\\"performer-top\\\"><span>KIRA-9 / 001</span><span id=\\\"playstate\\\">STANDBY</span></div><canvas id=\\\"face\\\" width=\\\"240\\\" height=\\\"240\\\" aria-label=\\\"Animated cyborg singer preview\\\"></canvas><div class=\\\"voice-controls\\\"><label>VOICE<select id=\\\"voice\\\"><option value=\\\"0\\\">Bright</option><option value=\\\"1\\\">Deep</option><option value=\\\"2\\\">Airy</option><option value=\\\"3\\\">Smoky</option><option value=\\\"4\\\">Youthful</option><option value=\\\"5\\\">Mature</option><option value=\\\"6\\\">Synthetic</option></select></label><label>DELIVERY<select id=\\\"style\\\"><option value=\\\"0\\\">Pop</option><option value=\\\"1\\\">House</option><option value=\\\"2\\\">IDM</option><option value=\\\"3\\\">Trip-hop</option><option value=\\\"4\\\">Ambient</option><option value=\\\"5\\\">Soul</option><option value=\\\"6\\\">Experimental</option><option value=\\\"7\\\">Robotic</option></select></label></div><div class=\\\"transport\\\"><button id=\\\"play\\\" class=\\\"primary\\\">\\u25b6 Preview song</button><button id=\\\"stop\\\" aria-label=\\\"Stop singing\\\">\\u25a0</button></div><p class=\\\"fine\\\">The browser runs the same C vocal engine as the firmware. Voice quality and the full style repertoire are still under development.</p><div class=\\\"meter\\\"><span id=\\\"progress\\\"></span></div><p id=\\\"capacity\\\" class=\\\"fine\\\">Compile a song to check its size.</p></aside>\\n<div class=\\\"editor\\\"><div class=\\\"tabs\\\" role=\\\"tablist\\\"><button class=\\\"active\\\" id=\\\"lyricsTab\\\">01 \\u00b7 LYRICS</button><button id=\\\"timingTab\\\">02 \\u00b7 PRONUNCIATION & MELODY</button></div><div id=\\\"lyricsPanel\\\"><div class=\\\"title-row\\\"><label>SONG TITLE<input id=\\\"title\\\" value=\\\"Neon Awakening\\\" maxlength=\\\"80\\\"></label><label>BPM<input id=\\\"bpm\\\" type=\\\"number\\\" min=\\\"30\\\" max=\\\"300\\\" value=\\\"120\\\"></label><label>KEY OFFSET<input id=\\\"key\\\" type=\\\"number\\\" min=\\\"-12\\\" max=\\\"12\\\" value=\\\"0\\\"></label></div><div class=\\\"actions\\\"><label>PERFORMANCE SECTION<select id=\\\"section\\\"><option value=\\\"all\\\">Full song</option></select></label><button id=\\\"sectionRewrite\\\">Rewrite selected section</button></div><label for=\\\"lyrics\\\" class=\\\"sr\\\">Your lyrics</label><textarea id=\\\"lyrics\\\" spellcheck=\\\"true\\\" placeholder=\\\"Paste your lyrics. Your wording stays yours.\\\"></textarea><div class=\\\"editor-footer\\\"><span id=\\\"autosave\\\">Saved on this browser</span><label class=\\\"filebutton\\\">Import lyrics<input id=\\\"textfile\\\" type=\\\"file\\\" accept=\\\".txt,text/plain\\\"></label></div><details><summary>Start from an idea</summary><p class=\\\"fine\\\">Offline rule-based starter. Your idea enters the first verse; mood and delivery guide the tempo and an original lyric structure. This is not an AI service, and it does not rewrite an existing draft automatically.</p><div class=\\\"generate-row\\\"><input id=\\\"idea\\\" placeholder=\\\"A new beginning in a neon city\\\" maxlength=\\\"80\\\"><select id=\\\"mood\\\"><option value=\\\"bright\\\">Bright</option><option value=\\\"quiet\\\">Quiet</option></select><button id=\\\"generate\\\">Create new draft</button></div></details></div><div id=\\\"timingPanel\\\" hidden><p class=\\\"fine\\\">Edit each word\\u2019s ARPAbet phonemes, MIDI note, and duration in ticks (96 per quarter note). Section headings are preserved but never sung. Unknown words need an explicit pronunciation.</p><div class=\\\"table-wrap\\\"><table><thead><tr><th>WORD</th><th>PHONEMES</th><th>MIDI NOTE</th><th>TICKS</th><th>STRESS</th><th>LEVEL</th><th>BREATH</th><th>PHONEME TICKS</th><th>MELISMA</th></tr></thead><tbody id=\\\"alignment\\\"></tbody></table></div><label>QUANTIZE<select id=\\\"quantize\\\"><option value=\\\"1\\\">Exact</option><option value=\\\"6\\\">1/64</option><option value=\\\"12\\\">1/32</option><option value=\\\"24\\\">1/16</option><option value=\\\"48\\\">1/8</option></select></label><button id=\\\"compile\\\">Validate performance</button><button id=\\\"fromLyrics\\\">Rebuild score from lyrics</button><div class=\\\"table-wrap\\\"><table><thead><tr><th>Tick</th><th>Phoneme</th><th>Note</th><th>Length</th><th>Level</th><th>Stress</th></tr></thead><tbody id=\\\"scoreRows\\\"></tbody></table></div></div><div id=\\\"status\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">Loading pronunciation dictionary\\u2026</div></div></section>\\n<section id=\\\"library\\\" class=\\\"library\\\"><div class=\\\"section-heading\\\"><div><p class=\\\"eyebrow\\\">YOUR PERFORMANCE LIBRARY</p><h2>Keep every signal.</h2></div><div class=\\\"actions\\\"><button id=\\\"undo\\\">Undo</button><button id=\\\"redo\\\">Redo</button><button id=\\\"exportProject\\\">Export project</button><label class=\\\"filebutton\\\">Open project<input id=\\\"projectfile\\\" type=\\\"file\\\" accept=\\\".json\\\"></label><button id=\\\"exportSong\\\">Export device song</button></div></div><div class=\\\"library-tools\\\"><div class=\\\"actions\\\"><button id=\\\"saveProject\\\">Save project copy</button><select id=\\\"savedProjects\\\" aria-label=\\\"Saved projects\\\"></select><button id=\\\"openSaved\\\">Open saved</button><button id=\\\"deleteSaved\\\">Delete saved</button><button id=\\\"exportLibrary\\\">Export complete library</button><label class=\\\"filebutton\\\">Restore library<input id=\\\"restoreLibrary\\\" type=\\\"file\\\" accept=\\\".json\\\"></label></div><details><summary>Pronunciation library</summary><p class=\\\"fine\\\">One English word and its ARPAbet pronunciation per line. For example: kira = K IH R AH. Corrections apply to new compilations; your lyric text stays intact.</p><textarea id=\\\"pronunciations\\\" aria-label=\\\"Pronunciation library\\\" placeholder=\\\"kira = K IH R AH\\\"></textarea><button id=\\\"savePronunciations\\\">Save pronunciations</button></details><details><summary>Eight editable voice presets</summary><p class=\\\"fine\\\">Voice 0\\u20136 \\u00b7 Style 0\\u20137 \\u00b7 Emotion 0\\u20133 \\u00b7 Morph/breath/vibrato/glide 0\\u2013100 \\u00b7 Harmony \\u221212\\u202612 semitones (0 off) \\u00b7 Expression 0\\u2013127.</p><div class=\\\"table-wrap\\\"><table><thead><tr><th>Name</th><th>Voice</th><th>Style</th><th>Emotion</th><th>Morph</th><th>Breath</th><th>Vibrato</th><th>Glide</th><th>Harmony</th><th>Expression</th><th>Audition</th></tr></thead><tbody id=\\\"presetRows\\\"></tbody></table></div></details><div class=\\\"actions\\\"><select id=\\\"libraryKind\\\" aria-label=\\\"Independent device library\\\"><option value=\\\"3\\\">Pronunciations</option><option value=\\\"4\\\">Voice presets</option></select><button id=\\\"sendLibrary\\\">Save library to device</button><button id=\\\"readLibrary\\\">Read library from device</button></div></div><div id=\\\"demos\\\" class=\\\"demos\\\"></div><p class=\\\"fine\\\">Factory demos contain original lyrics and explicit phoneme/melody timing. Browser storage is local to this browser. Export projects for an independent backup.</p><div class=\\\"device-row\\\"><div><h3>Send to KIRA-9</h3><p class=\\\"fine\\\">USB MIDI \\u00b7 bounded CRC-checked transfer \\u00b7 stop device playback first.</p></div><button id=\\\"connect\\\">Choose MIDI ports</button><select id=\\\"midiIn\\\" aria-label=\\\"MIDI input\\\"></select><select id=\\\"midiOut\\\" aria-label=\\\"MIDI output\\\"></select><label>Slot<select id=\\\"slot\\\"><option value=\\\"0\\\">1</option><option value=\\\"1\\\">2</option><option value=\\\"2\\\">3</option><option value=\\\"3\\\">4</option><option value=\\\"4\\\">5</option><option value=\\\"5\\\">6</option><option value=\\\"6\\\">7</option><option value=\\\"7\\\">8</option></select></label><label>Type<select id=\\\"kind\\\"><option value=\\\"0\\\">Song</option><option value=\\\"1\\\">Phrase</option><option value=\\\"2\\\">Word</option></select></label><button id=\\\"transfer\\\">Transfer song</button><button id=\\\"receiveSong\\\">Read from device</button><button id=\\\"sendArrangement\\\">Transfer full arrangement</button></div></section>\\n<section id=\\\"install\\\" class=\\\"install\\\"><div><p class=\\\"eyebrow\\\">M-VAVE FM-1</p><h2>The voice lives<br>on the instrument.</h2></div><div><p>Standalone singing works without a host or network. USB and Bluetooth MIDI let KIRA-9 follow a compatible instrument.</p><p class=\\\"notice\\\">First-release acceptance is still open. Firmware installation is unavailable until vocal, animation, storage, editor, and update gates pass.</p><a class=\\\"repo\\\" href=\\\"https://github.com/CodingSlapfu/KIRA-9\\\">Follow development on GitHub \\u2197</a></div></section></main><footer><span>KIRA-9 \\u00b7 ORIGINAL CYBERNETIC VOCALIST</span><a href=\\\"CMUDICT-LICENSE.txt\\\">Pronunciation dictionary license</a><a href=\\\"https://github.com/CodingSlapfu/KIRA-9\\\">Source & licenses</a></footer><script type=\\\"module\\\" src=\\\"app.mjs\\\"></script></body></html>\\n\",\"sha256\":\"28738ffc02a3421d7afeb32a354e7416d16400d4d1a647f5325f666eed509d2c\"},\"studio/transfer.mjs\":{\"content\":\"// SPDX-License-Identifier: MIT; uses standard FM-1 update framing, song command 0x61.\\nimport {crc32} from './model.mjs';\\nexport function pack7(bytes){let acc=0,bits=0;const out=[];for(const b of bytes){acc|=b<<bits;bits+=8;while(bits>=7){out.push(acc&127);acc>>>=7;bits-=7;}}if(bits)out.push(acc&127);return out;}\\nexport function unpack7(bytes){let acc=0,bits=0;const out=[];for(const b of bytes){if(b>127)throw Error('Invalid MIDI encoding');acc|=b<<bits;bits+=7;while(bits>=8){out.push(acc&255);acc>>>=8;bits-=8;}}return out;}\\nconst u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];\\nexport function frame(command,body){const sum=body.reduce((a,b)=>a+b,0);return [240,...pack7([0,89,command,body.length&255,body.length>>>8,0,...body,(~sum)&255]),247];}\\nexport function request(bytes){if(bytes[0]!==240||bytes.at(-1)!==247)return null;const d=unpack7(bytes.slice(1,-1));if(d.length!==15||d[0]!==0||d[1]!==89||d[2]!==48||((~d.slice(6,14).reduce((a,b)=>a+b,0))&255)!==d[14])return null;return {flag:d[6],address:(d[7]|d[8]<<8|d[9]<<16|d[10]<<24)>>>0,length:d[11]|d[12]<<8|d[13]<<16};}\\nexport function reply(r,data){return frame(48,[r.flag,...u32(r.address),data.length&255,data.length>>>8,0,...data]);}\\nexport async function legacyTransfer(input,output,bytes,slot,progress=()=>{},kind=0){if(bytes.length>3840)throw Error('This performance exceeds the current device slot (3840 bytes). Split it into sections.');if(slot<0||slot>7||kind<0||kind>2)throw Error('Invalid slot.');await input.open();await output.open();return new Promise((resolve,reject)=>{let finished=false;const done=(error)=>{if(finished)return;finished=true;clearTimeout(timer);input.removeEventListener('midimessage',on);error?reject(error):resolve();};const timer=setTimeout(()=>done(Error('Transfer timed out. The saved song has not been confirmed.')),15000);const on=({data})=>{try{const r=request([...data]);if(!r)return;if((r.address>>>24)===0xc2){output.send(reply(r,[170]));const code=r.address&255;done(code?Error(['','Invalid command','Invalid size or slot','Stop device playback first','USB data read failed','Song checksum or format failed','Flash save failed'][code]||'Device rejected transfer'):null);return;}if(r.length<1||r.length>128||r.address+r.length>bytes.length){done(Error('Device requested data outside this song.'));return;}output.send(reply(r,[...bytes.subarray(r.address,r.address+r.length)]));progress((r.address+r.length)/bytes.length);}catch(error){done(error);}};input.addEventListener('midimessage',on);output.send(frame(97,[slot,bytes.length&255,bytes.length>>>8,...u32(crc32(bytes)),kind]));});}\\n\\n// Protocol v2: bounded, idempotent BEGIN/WRITE/COMMIT and CRC-checked READ.\\nconst activePorts=new WeakSet();\\nlet transactionCounter=Math.floor(Math.random()*65535);\\nexport function parseFrame(bytes){if(bytes[0]!==240||bytes.at(-1)!==247)return null;let p;try{p=unpack7(bytes.slice(1,-1));}catch{return null;}if(p.length<7||p[0]!==0||p[1]!==89)return null;const n=p[3]|p[4]<<8|p[5]<<16;if(p.length!==n+7||((~p.slice(6,6+n).reduce((a,b)=>a+b,0))&255)!==p[6+n])return null;return {op:p[2],body:new Uint8Array(p.slice(6,6+n))};}\\nconst read16=(p,i)=>p[i]|p[i+1]<<8;\\nconst read32=(p,i)=>(p[i]|p[i+1]<<8|p[i+2]<<16|p[i+3]<<24)>>>0;\\nconst le16=n=>[n&255,n>>>8];\\nconst errors=['','Invalid command','Invalid size or slot','Stop device playback / backup first','Unexpected chunk offset','Checksum or content rejected','Flash save or verification failed','Empty slot','Transaction expired; retry the transfer'];\\nasync function exchange(input,output,tx,op,body,options={}){const retries=options.retries??3,timeout=options.timeout??700;for(let attempt=0;attempt<=retries;attempt++){const answer=await new Promise((resolve,reject)=>{let timer;const finish=(value,error)=>{clearTimeout(timer);input.removeEventListener('midimessage',on);error?reject(error):resolve(value);};const on=({data})=>{const f=parseFrame([...data]);if(!f||f.op!==0x67||f.body.length<13||read16(f.body,0)!==tx||f.body[2]!==op)return;const p=f.body,len=p[12];if(p.length!==13+len)return;finish({code:p[3],offset:read16(p,4),total:read16(p,6),crc:read32(p,8),data:p.slice(13)});};input.addEventListener('midimessage',on);timer=setTimeout(()=>finish(null),timeout);try{output.send(frame(op,[...le16(tx),...body]));}catch(error){finish(null,error);}});if(answer){if(answer.code){const error=Error(errors[answer.code]||'Device rejected transfer');error.code=answer.code;error.offset=answer.offset;throw error;}return answer;}}throw Error('No transfer acknowledgement. Reconnect KIRA-9 and retry; the last committed file stays intact.');}\\nasync function session(input,output,fn){if(!input||!output)throw Error('Select both KIRA-9 MIDI ports.');if(activePorts.has(output))throw Error('A transfer already uses this MIDI output.');activePorts.add(output);try{await input.open();await output.open();const tx=(++transactionCounter)&65535;return await fn(tx);}finally{activePorts.delete(output);}}\\nexport async function upload(input,output,bytes,slot,progress=()=>{},kind=0,options={}){if(!(bytes instanceof Uint8Array)||bytes.length<17||bytes.length>3840)throw Error('Asset must fit the 3840-byte device object. Split long songs into sections.');if(!Number.isInteger(slot)||slot<0||slo\nKIRA_SOURCE_EOF\n"
