ta(1);fallbackFrames=[];const profiles=new ProfileTimeline(e,timeline(source,{...dictionary,...userPronunciations}));status('Rendering shared C vocal preview\\u2026');\\n  for(let i=0;i<frames;){if(serial!==previewSerial)return;const next=profiles.profiles[profiles.index+1],boundary=next?Math.ceil(next.tick*60/song.bpm/96*44100):frames;profiles.advance(e.web_tick());const n=Math.min(512,frames-i,Math.max(1,boundary-i)),p=e.web_render(n),pcm=new Float32Array(e.memory.buffer,p,n*2);for(let j=0;j<n;j++){left[i+j]=pcm[j*2];right[i+j]=pcm[j*2+1];}fallbackFrames.push({time:i/44100,viseme:e.web_viseme(),pose:e.web_pose(),tick:e.web_tick(),emotion:profiles.profiles[profiles.index]?.parameters.emotion||0});i+=n;if(i%32768===0)await new Promise(r=>setTimeout(r,0));}\\n  if(serial!==previewSerial)return;bufferSource=ctx.createBufferSource();bufferSource.buffer=buffer;bufferSource.connect(ctx.destination);fallbackStart=ctx.currentTime;playing=true;\\u0024('playstate').textContent='SINGING';bufferSource.onended=()=>{if(serial===previewSerial){playing=false;\\u0024('playstate').textContent='STANDBY';}};bufferSource.start();status(frames===44100*120?'Playing the first 120 seconds through the shared C engine.':'Playing the shared C vocal engine.');\\n }\\n }catch(e){status(e.message);}}\\nfunction download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}\\nfunction newProject(next){stop();remember();project=validateProject(next);fill();}\\nfor(const key of ['title','lyrics','bpm','key','quantize'])\\u0024(key).addEventListener('input',()=>{remember();read();if(key==='lyrics'){project.align=[];delete project.events;delete project.scoreOnly;sectionOptions();fillVocal();}alignment();node?.port.postMessage({command:'voice',voice:performanceProject(project,\\u0024('section').value).voice??0,style:performanceProject(project,\\u0024('section').value).sty